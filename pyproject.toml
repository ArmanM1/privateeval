[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privateeval"
version = "0.1.0"
description = "A reproducible CPU-first evaluation lab for interactive summarization."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PrivateEval contributors" }]
dependencies = []

[project.optional-dependencies]
local = [
  "psutil==6.1.1",
  "torch==2.7.1",
  "transformers==4.53.2",
  "sentencepiece==0.2.0",
  "sentence-transformers==5.0.0",
]
test = ["pytest==8.4.1"]

[project.scripts]
privateeval = "privateeval.cli:main"

[tool.setuptools.packages.find]
include = ["privateeval*"]

[tool.pytest.ini_options]
testpaths = ["tests_py"]
addopts = "-q"

